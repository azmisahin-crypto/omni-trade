
# e2-micro (1 vCPU, 1GB RAM) gibi küçük VM'lerde çalıştırmak için mem_limit
# ve log rotasyonu ekli — bkz. CHANGELOG.md Faz 2. mem_limit aşılırsa
# container OOM-killed olur ve `restart: unless-stopped` sayesinde yeniden
# başlar; sınırsız log büyümesi ise diskin dolup makinenin kilitlenmesine
# yol açabileceği için ayrıca sınırlanıyor.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build: .
    container_name: omnitrade-bot
    restart: unless-stopped
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    mem_limit: 300m
    logging: *default-logging
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: ["python", "-m", "omnitrade.cli", "run"]

  web:
    build: .
    container_name: omnitrade-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "0.0.0.0:8090:8080"   # SSH tünelle veya reverse proxy ile dışarı aç
    mem_limit: 150m
    logging: *default-logging
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: ["python", "-m", "omnitrade.cli", "web"]
