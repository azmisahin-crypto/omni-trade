name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ccxt kasıtlı olarak kurulmuyor: test suite ağdan/borsadan
          # bağımsız çalışır (README'deki iddia), CI'ın hızlı kalması için
          # sadece gerçekten gereken paketler kuruluyor.
          pip install pandas pyyaml requests

      - name: Run test suite
        run: PYTHONPATH=. python -m unittest discover -s tests -v
